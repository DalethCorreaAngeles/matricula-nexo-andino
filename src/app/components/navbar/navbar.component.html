<nav class="navbar">
  <div class="nav-container">
    <div class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
          <path d="M6 6h10"></path>
          <path d="M6 10h10"></path>
          <path d="M6 14h6"></path>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Nexo Andino</span>
        <span class="brand-subtitle">Matrícula</span>
      </div>
    </div>

    <ul class="nav-links">
      <li>
        <a routerLink="/oferta-cursos" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M3 9h18"></path>
            <path d="M9 21V9"></path>
          </svg>
          Oferta de cursos
        </a>
      </li>
      <li>
        <a routerLink="/matricularme" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <line x1="19" x2="19" y1="8" y2="14"></line>
            <line x1="22" x2="16" y1="11" y2="11"></line>
          </svg>
          Matricularme
        </a>
      </li>
      <li>
        <a routerLink="/registrar-pago" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="20" height="14" x="2" y="5" rx="2"></rect>
            <line x1="2" x2="22" y1="10" y2="10"></line>
          </svg>
          Registrar pago
        </a>
      </li>
      <li>
        <a routerLink="/panel-asesor" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          Panel del asesor
        </a>
      </li>
    </ul>

    <div class="nav-actions">
      <button 
        class="db-status-btn"
        [class.connected]="supabaseService.isConnected()"
        [class.disconnected]="!supabaseService.isConnected()"
        (click)="onOpenConfig()"
        title="Configurar Supabase"
      >
        <span class="status-indicator"></span>
        <span class="status-text">
          {{ supabaseService.isConnected() ? 'Supabase Conectado' : 'Configurar BD' }}
        </span>
      </button>
    </div>
  </div>
</nav>
